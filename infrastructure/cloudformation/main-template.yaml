AWSTemplateFormatVersion: '2010-09-09'
Description: Main CloudFormation template that orchestrates nested stacks for a web application

Parameters:
  Environment:
    Type: String
    Default: dev
    AllowedValues:
      - dev
      - test
      - prod
    Description: The deployment environment
  
  VpcId:
    Type: AWS::EC2::VPC::Id
    Description: ID of the existing company VPC

  TemplateBucket:
    Type: String
    Description: Name of the S3 bucket the nested stack templates were uploaded to

  DeploymentName:
    Type: String
    Description: >-
      Short, unique, AWS-safe identifier for this deployment (see
      scripts/compute-deploy-name.sh) — used to name resources inside the
      nested stacks consistently, since AWS::StackName inside a nested stack
      refers to that nested stack's own auto-generated name, not this one.

Resources:
  # Security Groups Stack
  SecurityGroupsStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/security-groups.yaml
      Parameters:
        Environment: !Ref Environment
        VpcId: !Ref VpcId
        DeploymentName: !Ref DeploymentName
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # Lambda + HTTP API Stack
  ApiStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/api.yaml
      Parameters:
        Environment: !Ref Environment
        DeploymentName: !Ref DeploymentName
        LambdaCodeBucket: !Ref TemplateBucket
        LambdaCodeKey: lambda/example-function.zip
      Tags:
        - Key: Environment
          Value: !Ref Environment

  # S3 and CloudFront Stack
  StaticWebsiteStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: !Sub https://s3.${AWS::Region}.amazonaws.com/${TemplateBucket}/templates/static-website.yaml
      Parameters:
        Environment: !Ref Environment
        DeploymentName: !Ref DeploymentName
        ApiDomainName: !GetAtt ApiStack.Outputs.ApiEndpoint
      Tags:
        - Key: Environment
          Value: !Ref Environment

Outputs:
  WebServerSecurityGroupId:
    Description: Security Group ID for web servers
    Value: !GetAtt SecurityGroupsStack.Outputs.WebServerSecurityGroupId
    Export:
      Name: !Sub ${AWS::StackName}-WebServerSecurityGroupId

  WebsiteBucketName:
    Description: S3 Bucket for website content
    Value: !GetAtt StaticWebsiteStack.Outputs.WebsiteBucketName
    Export:
      Name: !Sub ${AWS::StackName}-WebsiteBucketName

  CloudFrontDistributionDomainName:
    Description: CloudFront Distribution Domain Name
    Value: !GetAtt StaticWebsiteStack.Outputs.CloudFrontDistributionDomainName
    Export:
      Name: !Sub ${AWS::StackName}-CloudFrontDomainName

  WebsiteUrl:
    Description: URL of the static website
    Value: !GetAtt StaticWebsiteStack.Outputs.WebsiteUrl
    Export:
      Name: !Sub ${AWS::StackName}-WebsiteUrl

  ApiEndpoint:
    Description: API Gateway HTTP API endpoint (also reachable via the CloudFront distribution's /api/* path)
    Value: !GetAtt ApiStack.Outputs.ApiEndpoint
    Export:
      Name: !Sub ${AWS::StackName}-ApiEndpoint